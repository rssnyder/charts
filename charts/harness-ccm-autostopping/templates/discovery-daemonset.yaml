---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "harness-ccm-autostopping.sdNode.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: sd-node
    {{- include "harness-ccm-autostopping.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "harness-ccm-autostopping.sdNode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.discovery.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "harness-ccm-autostopping.sdNode.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.discovery.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "harness-ccm-autostopping.discoveryServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.discovery.podSecurityContext | nindent 8 }}
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostPID: true
      containers:
      - name: sd-node
        image: {{ .Values.discovery.image.repository }}:{{ .Values.discovery.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.discovery.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.discovery.securityContext | nindent 12 }}
        command:
        - collector
        args:
        - --permanent-installation=true
        - --webhook-only=true
        - --debug=true
        - --mode=node
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: WEBHOOK_URL
          # value: http://{{ include "harness-ccm-autostopping.controller.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:9443/traffic-events
          value: http://autostopping-controller.{{ .Release.Namespace }}.svc.cluster.local:9443/traffic-events
        resources:
          {{- toYaml .Values.discovery.resources | nindent 12 }}
        {{- with .Values.discovery.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}