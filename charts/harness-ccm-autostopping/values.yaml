# Default values for harness-ccm-autostopping.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# CCM K8s connector id for the cluster you are installing into
connectorId:

# Harness account id
accountId:

# A Harness API token. The token must have CCM:Read and Autostopping:Create/Edit/Delete access
apiToken:

# optional settings

# Use existing Secret which stores apiToken key instead of creating a new one. The value should be set with the `apiToken` key inside the secret.
## If set, this parameter takes precedence over "apiToken".
## If set, the secret name must be EXACTLY "harness-api-key"
existingApiKey:

# Harness  URL, should be changed to "app3.harness.io" if you are using that cluster
harnessUrl: app.harness.io

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

image:
  repository: harness/autostopping-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

controller:

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

progressAgent:

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  resources:
    limits:
      memory: "128Mi"
      cpu: "100m"
    requests:
      memory: "128Mi"
      cpu: "100m"

  nodeSelector: {}

  tolerations: []

  affinity: {}

discovery:

  image:
    repository: harness/service-discovery-collector
    pullPolicy: IfNotPresent
    tag: permanent-collector-26a4fd1cac2ee0cde34d01cad7807cb7816f938c

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    privileged: true

  resources:
    # limits:
    #   memory: "128Mi"
    #   cpu: "100m"
    requests:
      memory: "128Mi"
      cpu: "100m"

  tolerations: []
